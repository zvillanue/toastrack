[package]
name = "toastrack-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ISO inspection and Secure Boot readiness analysis for Toastrack (no_std + alloc)"

[features]
default = ["std"]
std = []

[dependencies]
sha2 = { version = "0.10", default-features = false }
sha1 = { version = "0.10", default-features = false }
cms = { version = "0.2", default-features = false }
der = { version = "0.7", default-features = false, features = ["alloc"] }
x509-cert = { version = "0.2", default-features = false }

[dev-dependencies]
tempfile = "3"
