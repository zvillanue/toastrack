[package]
name = "toastrack-loader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Toastrack UEFI boot menu (build for x86_64-unknown-uefi)"

[dependencies]
uefi = { version = "0.41", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
uefi-raw = "0.17"
toastrack-core = { path = "../core", default-features = false }
font8x8 = { version = "0.3", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] } # UEFI target has no SSE
