[package]
name = "toastrack-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Toastrack graphical stick maker"

[[bin]]
name = "toastrack-gui"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"

[dependencies]
toastrack-installer = { path = "../installer" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[build-dependencies]
embed-resource = "2"
