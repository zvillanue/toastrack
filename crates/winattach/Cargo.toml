[package]
name = "toastrack-winattach"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Windows PE helper: attach the ISO chosen in the Toastrack menu as a virtual DVD so Windows Setup finds install.wim"

[[bin]]
name = "toastrack-attach"
path = "src/main.rs"

[dependencies]
toastrack-core = { path = "../core", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Vhd",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
  "Win32_System_SystemServices",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Environment",
] }
